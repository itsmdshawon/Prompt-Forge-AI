    <style>
      body { 
        font-family: 'Inter', sans-serif; 
        -webkit-font-smoothing: antialiased;
        /* -0.02em gives it that premium, high-end SaaS 'tight' look from the footer */
        letter-spacing: -0.022em; 
      }
      .gradient-bg {
        background: radial-gradient(circle at 20% 10%, rgba(139, 92, 246, 0.15), transparent 40%),
                    radial-gradient(circle at 80% 90%, rgba(217, 70, 239, 0.15), transparent 40%),
                    radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.05), transparent 60%);

      }
      .glass-card {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      }
      .premium-shadow {
        box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5), 
                    0 0 20px -5px rgba(139, 92, 246, 0.1);
      }
      .text-balance { text-wrap: balance; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
      
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      .float-animation { animation: float 6s ease-in-out infinite; }
      
      .heading-accent {
        color: #22d3ee; 
        font-weight: 900;
        letter-spacing: -0.04em;
      }
